<!DOCTYPE html>
<html lang="es" class="h-full"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale-1.0">
    <title>Calculadora de Honorarios y Gastos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-slate-800 bg-slate-100 transition-colors duration-300 h-full overflow-hidden">

    <div id="app-container" class="w-full h-full flex flex-col">
        &copy; 2025 Derechos Reservados. Contabilidad KIH.
        </p>

        <input type="hidden" id="exchange-rate">

        <header class="p-6 lg:p-8 max-w-7xl mx-auto w-full">
            <div class="relative flex flex-col items-center gap-4 sm:flex-row sm:justify-center">
                <div class="flex flex-col items-center gap-2">
                    <i class="ph-bold ph-calculator text-teal-500 text-2xl"></i>
                    <div class="text-center">
                        <h1 class="text-2xl font-bold text-slate-800">
                            TABLA CALCULO COMISIONES CLIENTES
                        </h1>
                        <p class="text-sm font-normal text-slate-500 dark:text-slate-400">
                            (CCC-002)
                        </p>
                    </div>
                </div>
                <button id="theme-toggle-btn" class="p-2 rounded-full text-slate-600 hover:bg-slate-200 transition-colors sm:absolute sm:right-0">
                    <i id="theme-sun-icon" class="ph-bold ph-sun text-2xl"></i>
                    <i id="theme-moon-icon" class="ph-bold ph-moon text-2xl hidden"></i>
                </button>
            </div>
        </header>

        <main class="w-full px-6 lg:px-8 flex-grow min-h-0">
            <div id="calculator-tab" class="tab-content h-full">
                <div class="grid grid-cols-5 gap-8 max-w-7xl mx-auto h-full pb-6 lg:pb-8">
                    
                    <div class="col-span-2 bg-white p-6 rounded-2xl shadow-lg overflow-y-auto no-scrollbar">
                        <h2 class="text-xl font-bold mb-6 flex items-center gap-3 text-slate-800"><i class="ph-bold ph-pencil-simple-line text-teal-500"></i>Realizar Nuevo Cálculo</h2>
                        <form id="calculation-form" class="space-y-5">
                            <div>
                                <label for="calc-client" class="block text-sm font-semibold text-slate-600 mb-1">Cliente</label>
                                <select id="calc-client" required class="form-input">
                                    <option value="">Seleccione un cliente...</option>
                                </select>
                                <p id="calc-client-info" class="text-sm text-sky-700 font-medium mt-2 min-h-[20px] px-1"></p>
                            </div>
                            <div>
                                <label for="calc-fee-rule" class="block text-sm font-semibold text-slate-600 mb-1">Regla de Honorarios</label>
                                <select id="calc-fee-rule" required class="form-input" disabled>
                                    <option value="">Seleccione una regla...</option>
                                </select>
                            </div>
                            <div>
                                <label for="calc-expense-profile" class="block text-sm font-semibold text-slate-600 mb-1">Perfil de Otros Gastos</label>
                                <select id="calc-expense-profile" required class="form-input" disabled>
                                    <option value="">Seleccione un perfil...</option>
                                </select>
                            </div>
                            <div>
                                <label for="cif-local" class="block text-sm font-semibold text-slate-600 mb-1">Valor CIF (en Bs.)</label>
                                <input type="number" id="cif-local" step="0.01" required class="form-input" disabled>
                            </div>
                            <div>
                                <label for="item-count" class="block text-sm font-semibold text-slate-600 mb-1">Cantidad de Items</label>
                                <input type="number" id="item-count" value="1" min="0" required class="form-input" disabled>
                            </div>
                            <div class="pt-2 space-y-3">
                                <label class="block text-sm font-semibold text-slate-600">Gastos Opcionales</label>
                                <div class="flex items-center">
                                    <input id="calc-regularizacion" type="checkbox" class="h-5 w-5 rounded-md border-slate-300 text-teal-600 focus:ring-teal-500 transition" disabled>
                                    <label for="calc-regularizacion" class="ml-3 block text-sm text-slate-800">Incluir Regularización Anticipado</label>
                                </div>
                                <div class="flex items-center">
                                    <input id="calc-frontera" type="checkbox" class="h-5 w-5 rounded-md border-slate-300 text-teal-600 focus:ring-teal-500 transition" disabled>
                                    <label for="calc-frontera" class="ml-3 block text-sm text-slate-800">Incluir Despacho Frontera</label>
                                </div>
                                <div class="flex items-center">
                                    <input id="calc-dam" type="checkbox" class="h-5 w-5 rounded-md border-slate-300 text-teal-600 focus:ring-teal-500 transition" disabled>
                                    <label for="calc-dam" class="ml-3 block text-sm text-slate-800">Incluir Formulario DAM</label>
                                </div>
                                <div class="flex items-center">
                                    <input id="calc-otros-servicios" type="checkbox" class="h-5 w-5 rounded-md border-slate-300 text-teal-600 focus:ring-teal-500 transition" disabled>
                                    <label for="calc-otros-servicios" class="ml-3 block text-sm text-slate-800">Incluir Otros Servicios</label>
                                </div>
                            </div>
                            <div class="h-4"></div>
                        </form>
                    </div>

                    <div class="col-span-3 bg-white p-6 rounded-2xl shadow-lg overflow-y-auto no-scrollbar">
                        <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-slate-800"><i class="ph-bold ph-chart-bar text-teal-500"></i>Resultado del Cálculo</h2>
                        <div id="calculation-result" class="text-slate-600 min-h-[300px]">
                            <p>Complete los campos para ver el cálculo en tiempo real.</p>
                        </div>
                            <button id="save-calculation-btn" class="mt-6 hidden w-full bg-emerald-600 text-white font-bold py-3 px-4 rounded-xl hover:bg-emerald-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition-all transform hover:scale-[1.02] shadow-md flex items-center justify-center gap-2">
                            <i class="ph ph-floppy-disk"></i> Guardar Cálculo en Historial
                        </button>
                    </div>
                </div>
            </div>
        </main>
        <div id="notification" class="fixed bottom-5 right-5 text-white py-3 px-6 rounded-xl shadow-2xl text-base opacity-0 transition-all duration-300 transform translate-y-4 z-50">
            <p id="notification-message"></p>
        </div>

        <button id="image-bubble-btn" class="hidden fixed bottom-6 right-6 z-40 bg-purple-600 text-white w-16 h-16 rounded-full shadow-lg flex items-center justify-center hover:bg-purple-700 transition-all transform hover:scale-110">
            <i class="ph-bold ph-image text-3xl"></i>
        </button>

        <div id="image-hover-overlay" class="fixed inset-0 bg-black/80 flex items-center justify-center p-10 z-[60] opacity-0 pointer-events-none transition-opacity duration-300">
            <img id="hover-image" src="" alt="Recordatorio" class="max-w-full max-h-full rounded-lg shadow-2xl">
        </div>

    </div> <footer class="w-full p-6 text-center">
        <p class="text-sm text-slate-500 dark:text-slate-400">
            &copy; 2025 Derechos Reservados. Contabilidad KIH.
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
